name: CadFlux foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cadflux
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: cadflux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadflux -d cadflux_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://cadflux:ci_only@127.0.0.1:5432/cadflux_test
      DATABASE_URL_TEST: postgresql://cadflux:ci_only@127.0.0.1:5432/cadflux_test
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
