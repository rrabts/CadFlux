services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: cadflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadflux_dev_only}
      POSTGRES_DB: cadflux
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cadflux-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadflux -d cadflux"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cadflux-db:
